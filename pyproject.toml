[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-pet"
version = "0.1.0"
description = "A little colorful ASCII pet (duck, mouse, bunny, or raccoon) that wanders around your terminal and reacts to the commands you run."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Philipp Putze", email = "putze1@me.com"}]
keywords = ["terminal", "cli", "pet", "ascii-art", "curses", "productivity", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
iterm = ["iterm2"]
dev = ["pytest>=7"]

[project.scripts]
terminal-pet = "terminal_pet.cli:main"
terminal-pet-install-hook = "terminal_pet.hook:run"
terminal-pet-uninstall-hook = "terminal_pet.hook:uninstall"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
